name: Release

on:
  push:
    tags: ["v*"]
  # Recovery path: tags pushed on a commit whose message contains [skip ci]
  # (or tags created from the Releases UI on such a commit) do not trigger
  # the push event, so this lets a tag be released on demand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      # Optional. When unset, the Homebrew bump step is skipped and the
      # release still succeeds. Add it as a repository secret to publish
      # the formula to akhenakh/homebrew-tap.
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$INPUT_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        if: env.TAP_GITHUB_TOKEN != '' && steps.tag.outputs.tag != ''
        run: scripts/brew-bump.sh "${{ steps.tag.outputs.tag }}"
