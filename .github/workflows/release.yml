name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      # Optional. When unset, the Homebrew bump step is skipped and the
      # release still succeeds. Add it as a repository secret to publish
      # the formula to akhenakh/homebrew-tap.
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        if: env.TAP_GITHUB_TOKEN != ''
        run: scripts/brew-bump.sh "${GITHUB_REF#refs/tags/}"
