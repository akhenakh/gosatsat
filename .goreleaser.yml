version: 2

project_name: satsat

before:
  hooks:
    - go mod tidy

# Everything is CGO-free: shirei's desktop backends use purego (X11, Wayland,
# Cocoa, Win32), so every target cross compiles from Linux without an SDK.
#
# The darwin builds put their binary straight into the bundle layout
# (SatSat.app/Contents/MacOS/satsat). GoReleaser always adds the build binary
# to its archive, so this makes that unavoidable entry part of the .app: the
# macOS archives end up containing SatSat.app and nothing else.
builds:
  - id: satsat
    main: .
    binary: satsat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: satsat-darwin-amd64
    main: .
    binary: SatSat.app/Contents/MacOS/satsat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
    goarch:
      - amd64
    hooks:
      post:
        - sh packaging/macos/bundle.sh {{ .Path }} {{ .Version }}

  - id: satsat-darwin-arm64
    main: .
    binary: SatSat.app/Contents/MacOS/satsat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      post:
        - sh packaging/macos/bundle.sh {{ .Path }} {{ .Version }}

archives:
  # Linux + Windows: bare binary next to its Resources directory.
  - id: satsat
    ids:
      - satsat
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - Resources/*
      - README.md

  # macOS: the application bundle and nothing else. The build binary is
  # already at SatSat.app/Contents/MacOS/satsat and GoReleaser adds it to the
  # archive with its directory intact (strip_binary_directory defaults to
  # false); the `files` below complete the bundle around it.
  - id: satsat-darwin-amd64
    ids:
      - satsat-darwin-amd64
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_Darwin_x86_64"
    # Keep the binary at SatSat.app/Contents/MacOS/satsat in the archive.
    strip_binary_directory: false
    files:
      - src: dist/satsat-darwin-amd64_*/SatSat.app/Contents/Info.plist
        dst: SatSat.app/Contents
      - src: dist/satsat-darwin-amd64_*/SatSat.app/Contents/PkgInfo
        dst: SatSat.app/Contents
      - src: dist/satsat-darwin-amd64_*/SatSat.app/Contents/Resources/*
        dst: SatSat.app/Contents/Resources

  - id: satsat-darwin-arm64
    ids:
      - satsat-darwin-arm64
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_Darwin_arm64"
    # Keep the binary at SatSat.app/Contents/MacOS/satsat in the archive.
    strip_binary_directory: false
    files:
      - src: dist/satsat-darwin-arm64_*/SatSat.app/Contents/Info.plist
        dst: SatSat.app/Contents
      - src: dist/satsat-darwin-arm64_*/SatSat.app/Contents/PkgInfo
        dst: SatSat.app/Contents
      - src: dist/satsat-darwin-arm64_*/SatSat.app/Contents/Resources/*
        dst: SatSat.app/Contents/Resources

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
